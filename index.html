<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أسعار الذهب والفضة الآن</title>

<style>
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:linear-gradient(45deg,#d4af37,#ffd700);
    color:#000;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:95%;
    margin:auto;
    padding:15px;
}

.card{
    background:#222;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(255,215,0,.4);
}

h2{
    text-align:center;
    color:gold;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

th{
    background:gold;
    color:#000;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #444;
}

.buy{
    color:#00ff66;
    font-weight:bold;
}

.sell{
    color:#ff4444;
    font-weight:bold;
}

.info{
    text-align:center;
    font-size:18px;
    margin-top:15px;
    line-height:2;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#ccc;
    font-size:14px;
}

.loading{
    text-align:center;
    color:gold;
    padding:15px;
}

.error{
    text-align:center;
    color:#ff5555;
    padding:15px;
}
</style>
</head>

<body>

<header>
🪙 أسعار الذهب والفضة الآن 🪙
</header>

<div class="container">

<div class="card">

<h2>🥇 أسعار الذهب</h2>

<div id="loading" class="loading">
جاري تحديث الأسعار...
</div>

<table id="goldTable" style="display:none;">
<tr>
<th>العيار</th>
<th>شراء</th>
<th>بيع</th>
</tr>

<tr>
<td>24</td>
<td id="buy24" class="buy">--</td>
<td id="sell24" class="sell">--</td>
</tr>

<tr>
<td>21</td>
<td id="buy21" class="buy">--</td>
<td id="sell21" class="sell">--</td>
</tr>

<tr>
<td>18</td>
<td id="buy18" class="buy">--</td>
<td id="sell18" class="sell">--</td>
</tr>

</table>

<div class="info">

💰 سعر الجرام عيار 24:
<b id="price24">--</b> جنيه

<br>

💰 سعر الجرام عيار 21:
<b id="price21">--</b> جنيه

<br>

💰 سعر الجرام عيار 18:
<b id="price18">--</b> جنيه

</div>

<div id="status" class="status">
آخر تحديث: --
</div>

</div>


<div class="card">

<h2>🪙 أسعار الأونصة</h2>

<div class="info">

سعر أونصة الذهب:
<b id="ounce">--</b> جنيه

</div>

</div>


<div class="card">

<h2>🥈 أسعار الفضة</h2>

<table>

<tr>
<th>النوع</th>
<th>السعر</th>
</tr>

<tr>
<td>الفضة</td>
<td id="silver">--</td>
</tr>

</table>

</div>

</div>


<script>

const API =
"https://api.goldprice.dev/v1/carat?currency=EGP";

const REFRESH_TIME = 5 * 60 * 1000;


// تقريب السعر إلى أقرب جنيه
function formatPrice(value){

    return Math.round(Number(value)).toLocaleString("ar-EG");

}


// تحديث الأسعار
async function updatePrices(){

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("goldTable");

    try{

        loading.style.display = "block";
        loading.innerText =
            "🔄 جاري تحديث الأسعار...";

        const response =
            await fetch(API, {
                cache:"no-store"
            });

        if(!response.ok){
            throw new Error("API Error");
        }

        const data =
            await response.json();


        // أسعار الذهب بالجرام
        const price24 =
            Number(data.price_gram_24k);

        const price21 =
            Number(data.price_gram_21k);

        const price18 =
            Number(data.price_gram_18k);


        if(!price24 || !price21 || !price18){
            throw new Error("Invalid prices");
        }


        // عرض الأسعار
        document.getElementById("price24").innerText =
            formatPrice(price24);

        document.getElementById("price21").innerText =
            formatPrice(price21);

        document.getElementById("price18").innerText =
            formatPrice(price18);


        /*
          هنا نضع هامش بسيط للشراء والبيع.
          يمكنك تغييره لاحقاً حسب الأسعار المحلية.
        */

        const buy24 = price24 * 0.99;
        const sell24 = price24 * 1.01;

        const buy21 = price21 * 0.99;
        const sell21 = price21 * 1.01;

        const buy18 = price18 * 0.99;
        const sell18 = price18 * 1.01;


        document.getElementById("buy24").innerText =
            formatPrice(buy24);

        document.getElementById("sell24").innerText =
            formatPrice(sell24);

        document.getElementById("buy21").innerText =
            formatPrice(buy21);

        document.getElementById("sell21").innerText =
            formatPrice(sell21);

        document.getElementById("buy18").innerText =
            formatPrice(buy18);

        document.getElementById("sell18").innerText =
            formatPrice(sell18);


        // الأونصة = 31.1034768 جرام
        const ounce =
            price24 * 31.1034768;

        document.getElementById("ounce").innerText =
            formatPrice(ounce);


        table.style.display = "table";

        loading.style.display = "none";


        const now =
            new Date();

        document.getElementById("status").innerText =
            "🟢 آخر تحديث: " +
            now.toLocaleString("ar-EG");


    }catch(error){

        console.error(error);

        loading.innerText =
            "⚠️ تعذر تحديث الأسعار، سيتم المحاولة مرة أخرى تلقائياً.";

    }

}


// تحديث عند فتح الصفحة
updatePrices();


// تحديث تلقائي كل 5 دقائق
setInterval(updatePrices, REFRESH_TIME);

</script>

</body>
</html>
