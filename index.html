<script>
        const PROXY_URL = 'https://corsproxy.io/?';
        const TARGET_URL = 'https://t.me/s/younangold';

        async function fetchTelegramPrices() {
            const statusElement = document.getElementById('last-updated');
            const dot = document.getElementById('status-dot');

            try {
                const response = await fetch(PROXY_URL + encodeURIComponent(TARGET_URL) + '&t=' + Date.now());
                if (!response.ok) throw new Error('فشل جلب البيانات');

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const messages = doc.querySelectorAll('.tgme_widget_message_text');
                if (!messages.length) throw new Error('لا توجد منشورات');

                let latestText = '';
                for (let i = messages.length - 1; i >= 0; i--) {
                    const txt = messages[i].innerText;
                    if (txt.includes('21') || txt.includes('24') || txt.includes('عيار')) {
                        latestText = txt;
                        break;
                    }
                }

                if (!latestText) throw new Error('لم يتم العثور على الأسعار');

                parsePrices(latestText);

                const now = new Date();
                if (statusElement) statusElement.innerText = 'آخر تحديث: ' + now.toLocaleTimeString('ar-EG');
                if (dot) dot.style.backgroundColor = '#4caf50';

            } catch (err) {
                console.error(err);
                if (statusElement) statusElement.innerText = 'جاري التحديث...';
            }
        }

        function parsePrices(text) {
            const tbody = document.getElementById('gold-table-body');
            
            function getVal(carat) {
                const reg = new RegExp(carat + '[^0-9]*([0-9]{4,5})', 'i');
                const m = text.match(reg);
                return m ? m[1] : '-';
            }

            const p24 = getVal('24');
            const p21 = getVal('21');
            const p18 = getVal('18');

            if (tbody) {
                tbody.innerHTML = 
                    '<tr><td>24</td><td class="buy-price">' + p24 + '</td><td class="sell-price">' + p24 + '</td></tr>' +
                    '<tr><td>21</td><td class="buy-price">' + p21 + '</td><td class="sell-price">' + p21 + '</td></tr>' +
                    '<tr><td>18</td><td class="buy-price">' + p18 + '</td><td class="sell-price">' + p18 + '</td></tr>';
            }
        }

        fetchTelegramPrices();
        setInterval(fetchTelegramPrices, 60000);
    </script>
