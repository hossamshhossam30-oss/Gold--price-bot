<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- منع الكاش نهائياً على مستوى الصفحة -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>أسعار الذهب والفضة الآن</title>
    <style>
        /* الأنماط والتصميم الخاص بك */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #ffd700;
            color: #000;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th {
            background-color: #ffd700;
            color: #000;
            padding: 10px;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        .buy-price { color: #4caf50; font-weight: bold; }
        .sell-price { color: #f44336; font-weight: bold; }
        .info-row { margin: 8px 0; font-size: 16px; }
        .timestamp { color: #888; font-size: 14px; margin-top: 15px; }
        .dot { height: 10px; width: 10px; background-color: #4caf50; border-radius: 50%; display: inline-block; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="header">
        🪙 أسعار الذهب والفضة الآن
    </div>

    <div class="card">
        <h2>🥇 أسعار الذهب</h2>
        <table>
            <thead>
                <tr>
                    <th>العيار</th>
                    <th>شراء</th>
                    <th>بيع</th>
                </tr>
            </thead>
            <tbody id="gold-table-body">
                <!-- سيتم ملء البيانات هنا -->
            </tbody>
        </table>

        <div id="gold-details">
            <!-- تفاصيل الأسعار -->
        </div>

        <div class="timestamp">
            <span class="dot"></span> آخر تحديث: <span id="last-updated">جاري التحميل...</span>
        </div>
    </div>

    <script>
        async function fetchPrices() {
            try {
                // إضائة حيلة منع الكاش بإضافة Timestamp برابط الطلب
                const response = await fetch('YOUR_API_ENDPOINT_HERE?t=' + new Date().getTime(), {
                    cache: "no-store"
                });
                
                const data = await response.json();

                // تحديث جدول الأسعار والبيانات (قم بتعديل المسميات حسب الـ API الخاص بك)
                updateUI(data);

                // تحديث وقت آخر تحديث
                const now = new Date();
                document.getElementById('last-updated').innerText = now.toLocaleDateString('ar-EG') + '، ' + now.toLocaleTimeString('ar-EG');
            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
            }
        }

        function updateUI(data) {
            // كود تحديث عناصر DOM بالبيانات الجديدة
        }

        // تشغيل الجلب فور فتح الصفحة
        fetchPrices();

        // إعادة الجلب تلقائياً كل 30 ثانية
        setInterval(fetchPrices, 30000);
    </script>
</body>
</html>
