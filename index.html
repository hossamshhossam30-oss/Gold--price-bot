<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسعار الذهب والفضة الآن</title>

<style>
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:linear-gradient(45deg,#b8860b,#ffd700);
    color:#000;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:95%;
    margin:auto;
    padding:15px;
}

.card{
    background:#222;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(255,215,0,.4);
}

h2{
    text-align:center;
    color:gold;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

th{
    background:gold;
    color:#000;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #444;
}

.buy{
    color:#00ff66;
    font-weight:bold;
}

.sell{
    color:#ff4444;
    font-weight:bold;
}

.info{
    text-align:center;
    font-size:20px;
    margin-top:15px;
    line-height:2;
}
</style>

</head>
<body>

<header>
⚱️ أسعار الذهب والفضة الآن ⚱️
</header>

<div class="container">

<div class="card">
<h2>أسعار الذهب</h2>

<table>
<tr>
<th>العيار</th>
<th>شراء</th>
<th>بيع</th>
</tr>

<tr>
<td>21</td>
<td class="buy">6000</td>
<td class="sell">5950</td>
</tr>

<tr>
<td>18</td>
<td class="buy">5143</td>
<td class="sell">5093</td>
</tr>

<tr>
<td>24</td>
<td class="buy">6857</td>
<td class="sell">6800</td>
</tr>

</table>

<div class="info">
🪙 الجنيه الذهب: <b>48000</b><br><br>
🌍 أونصة الذهب: <b>4160 $</b><br><br>
🥈 أونصة الفضة: <b>60.46 $</b>
</div>

</div>

<div class="card">

<h2>أسعار الفضة</h2>

<table>
<tr>
<th>النوع</th>
<th>شراء</th>
<th>بيع</th>
</tr>

<tr>
<td>نجم الدين</td>
<td class="buy">100</td>
<td class="sell">100</td>
</tr>

<tr>
<td>BTC</td>
<td class="buy">100</td>
<td class="sell">95</td>
</tr>

</table>

</div>

</div>

</body>
</html>
