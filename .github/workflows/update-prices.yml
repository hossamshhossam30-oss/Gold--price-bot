import json
import re
from urllib.request import Request, urlopen
from bs4 import BeautifulSoup

URL = "https://t.me/s/goldpricenowlive"

def fetch_gold_prices():
    req = Request(URL, headers={'User-Agent': 'Mozilla/5.0'})
    html = urlopen(req).read().decode('utf-8')
    soup = BeautifulSoup(html, 'html.parser')
    
    # جلب جميع النصوص من القناة
    messages = soup.find_all('div', class_='tgme_widget_message_text')
    if not messages:
        print("لم يتم العثور على رسائل")
        return

    # البحث عن آخر رسالة تحتوي على أسعار الذهب
    last_msg = ""
    for msg in reversed(messages):
        text = msg.get_text(separator="\n")
        if "اسعار الذهب الان" in text or "عيار 21" in text:
            last_msg = text
            break

    if not last_msg:
        print("لم يتم العثور على منشور يحتوي على أسعار الذهب")
        return

    print("--- نص الرسالة المستخرجة ---")
    print(last_msg)

    # استخراج القيم باستخدام Regex المتوافق مع تنسيق المنشور
    data = {
        "gold_18": extract_value(r"عيار\s*18\D*?(\d[\d,.]*)", last_msg),
        "gold_21": extract_value(r"عيار\s*21\D*?(\d[\d,.]*)", last_msg),
        "gold_24": extract_value(r"عيار\s*24\D*?(\d[\d,.]*)", last_msg),
        "gold_pound": extract_value(r"جنيه\s*الذهب\D*?(\d[\d,.]*)", last_msg),
        "ounce_usd": extract_value(r"الأونصة\s*بالدولار\D*?(\d[\d,.]*)", last_msg),
        "buy_price": extract_value(r"سعر\s*الشراء\D*?(\d[\d,.]*)", last_msg),
        "sell_price": extract_value(r"سعر\s*البيع\D*?(\d[\d,.]*)", last_msg),
        "usd_rate": extract_value(r"سعر\s*الدولار\D*?(\d[\d,.]*)", last_msg),
        "sagha_usd": extract_value(r"دولار\s*الصاغة\D*?(\d[\d,.]*)", last_msg)
    }

    # حفظ البيانات في ملف prices.json
    with open("prices.json", "w", encoding="utf-8") as f:
        json.dump(data, f, ensure_ascii=False, indent=4)
        print("\nتم تحديث ملف prices.json بنجاح!")

def extract_value(pattern, text):
    match = re.search(pattern, text)
    if match:
        return match.group(1).replace(",", "").strip()
    return "N/A"

if __name__ == "__main__":
    fetch_gold_prices()
