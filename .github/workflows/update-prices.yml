name: Update gold prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-prices-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch gold prices and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python - <<'PY'

          import json
          import re
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          from bs4 import BeautifulSoup


          CHANNEL_URL = "https://t.me/s/goldpricenowlive"
          JSON_FILE = "prices.json"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10; K) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Mobile Safari/537.36"
              ),
              "Cache-Control": "no-cache, no-store, max-age=0",
              "Pragma": "no-cache",
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8"
          }


          def normalize_digits(value):
              if value is None:
                  return value
              arabic_digits = str.maketrans("٠١٢٣٤٥٦٧٨٩", "0123456789")
              persian_digits = str.maketrans("۰۱۲۳۴۵۶۷۸۹", "0123456789")
              value = str(value).translate(arabic_digits)
              value = value.translate(persian_digits)
              return value


          def clean_number(value):
              value = normalize_digits(value)
              value = value.replace(",", "").replace("٬", "").replace(" ", "").strip()
              try:
                  if "." in value:
                      return float(value)
                  return int(value)
              except ValueError:
                  raise ValueError(f"رقم غير صالح: {value}")


          def extract_value(patterns, text):
              for pattern in patterns:
                  match = re.search(pattern, text, flags=re.IGNORECASE | re.UNICODE)
                  if match:
                      try:
                          return clean_number(match.group(1))
                      except ValueError:
                          continue
              return None


          cache_buster = str(int(time.time()))
          url = f"{CHANNEL_URL}?nocache={cache_buster}"

          print("====================================")
          print("جاري جلب أحدث أسعار الذهب...")
          print("====================================")

          try:
              response = requests.get(url, headers=HEADERS, timeout=30)
              response.raise_for_status()
          except requests.RequestException as e:
              raise SystemExit(f"فشل الاتصال بمصدر أسعار الذهب: {e}")

          response.encoding = "utf-8"
          soup = BeautifulSoup(response.text, "html.parser")

          messages = soup.find_all("div", class_="tgme_widget_message_text")
          if not messages:
              raise SystemExit("لم يتم العثور على رسائل في قناة Telegram")

          latest_message = None
          for message in reversed(messages):
              text = message.get_text(separator="\n", strip=True)
              has_21 = re.search(r"عيار\s*21", text, flags=re.UNICODE)
              has_18 = re.search(r"عيار\s*18", text, flags=re.UNICODE)
              if has_21 and has_18:
                  latest_message = text
                  break

          if not latest_message:
              raise SystemExit("لم يتم العثور على رسالة أسعار صالحة")

          print("\n========== أحدث رسالة ==========")
          print(latest_message)
          print("=================================\n")


          # استخراج العيارات
          price_24 = extract_value([r"عيار\s*24\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)
          price_21 = extract_value([r"عيار\s*21\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)
          price_18 = extract_value([r"عيار\s*18\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)

          # استخراج جنيه الذهب مع تجاهل رقم 21 الخاص بالعيار
          gold_pound = None
          for line in latest_message.split('\n'):
              if 'جنيه' in line and ('الذهب' in line or 'ذهب' in line):
                  numbers = re.findall(r'[\d٠-٩۰-۹]+', line)
                  valid_nums = [n for n in numbers if normalize_digits(n) != '21']
                  if valid_nums:
                      try:
                          gold_pound = clean_number(valid_nums[0])
                          break
                      except ValueError:
                          continue

          ounce_usd = extract_value([
              r"الأونصة\s*بالدولار\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)",
              r"اونصة\s*بالدولار\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"
          ], latest_message)

          buy_price = extract_value([r"سعر\s*الشراء\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)
          sell_price = extract_value([r"سعر\s*البيع\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)

          # استخراج سعر الدولار الاستخراج الصحيح بفرز الأسطر
          usd_to_egp = None
          for line in latest_message.split('\n'):
              if 'سعر الدولار' in line and 'الأونصة' not in line and 'الصاغة' not in line:
                  match = re.search(r'([\d٠-٩۰-۹]+[\.,٬]?[\d٠-٩۰-۹]*)', line)
                  if match:
                      try:
                          usd_to_egp = clean_number(match.group(1))
                          break
                      except ValueError:
                          continue

          sagha_usd = extract_value([r"دولار\s*الصاغة\D*?([\d٠-٩۰-۹][\d٠-٩۰-۹,.٬]*)"], latest_message)


          required_prices = {
              "price_gram_24k": price_24,
              "price_gram_21k": price_21,
              "price_gram_18k": price_18
          }

          for key, value in required_prices.items():
              if value is None or value <= 0:
                  raise SystemExit(f"خطأ في استخراج: {key}")


          new_prices = {
              "price_gram_24k": price_24,
              "price_gram_21k": price_21,
              "price_gram_18k": price_18,
              "gold_pound": gold_pound,
              "ounce_usd": ounce_usd,
              "buy_price": buy_price,
              "sell_price": sell_price,
              "usd_to_egp": usd_to_egp,
              "sagha_usd": sagha_usd
          }


          old_prices = {}
          if os.path.exists(JSON_FILE):
              try:
                  with open(JSON_FILE, "r", encoding="utf-8") as f:
                      old_prices = json.load(f)
              except Exception:
                  pass

          prices_changed = any(old_prices.get(k) != new_prices.get(k) for k in new_prices)

          egypt_now = datetime.now(ZoneInfo("Africa/Cairo"))
          updated_at = egypt_now.strftime("%Y-%m-%d %H:%M:%S")

          if prices_changed or not os.path.exists(JSON_FILE):
              new_prices["updated_at"] = updated_at
              new_prices["source"] = CHANNEL_URL
              with open(JSON_FILE, "w", encoding="utf-8") as f:
                  json.dump(new_prices, f, ensure_ascii=False, indent=2)
              print("تم تحديث prices.json")


          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if bot_token and chat_id:
              message_text = (
                  "اسعار الذهب الان 💰\n\n"
                  f"💍 عيار 18: <b>{price_18}</b> جنيه\n"
                  f"💍 عيار 21: <b>{price_21}</b> جنيه\n"
                  f"💍 عيار 24: <b>{price_24}</b> جنيه\n\n"
                  f"💎 جنيه الذهب: <b>{gold_pound}</b> جنيه\n"
                  f"📊 الأونصة بالدولار: <b>{ounce_usd}</b> دولار\n\n"
                  f"🌟 سعر الشراء: <b>{buy_price}</b>\n"
                  f"🌟 سعر البيع: <b>{sell_price}</b>\n\n"
                  f"💵 سعر الدولار: <b>{usd_to_egp}</b> جنيه\n"
                  f"💵 دولار الصاغة: <b>{sagha_usd}</b> جنيه"
              )

              telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              payload = {
                  "chat_id": chat_id,
                  "text": message_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }
              requests.post(telegram_url, data=payload, timeout=20)

          PY

      - name: Validate prices.json
        run: |
          python - <<'PY'
          import json, os, sys
          if not os.path.exists("prices.json"):
              sys.exit(1)
          with open("prices.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          for k in ["price_gram_24k", "price_gram_21k", "price_gram_18k"]:
              if not data.get(k):
                  sys.exit(1)
          print("تم التحقق من JSON بنجاح.")
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات."
          else
            git commit -m "Update gold prices"
            git push
          fi
