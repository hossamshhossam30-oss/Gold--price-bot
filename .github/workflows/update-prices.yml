import re
import os
import requests

def parse_gold_prices(raw_text):
    data = {
        'carat_18': 'غير متوفر',
        'carat_21': 'غير متوفر',
        'carat_24': 'غير متوفر',
        'gold_pound': 'غير متوفر',
        'ounce_usd': 'غير متوفر',
        'buy_price': 'غير متوفر',
        'sell_price': 'غير متوفر',
        'usd_rate': 'غير متوفر',
        'sagha_usd': 'غير متوفر'
    }
    
    lines = raw_text.split('\n')
    
    for line in lines:
        line = line.strip()
        if not line:
            continue
            
        try:
            # 1. أسعار العيارات
            if 'عيار 18' in line:
                match = re.search(r'(\d+)', line.split('18')[-1])
                if match: data['carat_18'] = match.group(1)
                
            elif 'عيار 21' in line:
                match = re.search(r'(\d+)', line.split('21')[-1])
                if match: data['carat_21'] = match.group(1)
                
            elif 'عيار 24' in line:
                match = re.search(r'(\d+)', line.split('24')[-1])
                if match: data['carat_24'] = match.group(1)
                
            # 2. سعر جنيه الذهب (تجاهل رقم 21 للعيار)
            elif 'جنيه الذهب' in line:
                numbers = re.findall(r'\d+', line)
                valid_numbers = [num for num in numbers if num != '21']
                if valid_numbers:
                    data['gold_pound'] = valid_numbers[0]
                    
            # 3. الأونصة بالدولار
            elif 'الأونصة' in line or 'الاونصة' in line:
                match = re.search(r'(\d+)', line)
                if match: data['ounce_usd'] = match.group(1)
                
            # 4. سعر الشراء والبيع
            elif 'سعر الشراء' in line:
                match = re.search(r'(\d+)', line)
                if match: data['buy_price'] = match.group(1)
                
            elif 'سعر البيع' in line:
                match = re.search(r'(\d+)', line)
                if match: data['sell_price'] = match.group(1)
                
            # 5. سعر الدولار ودولار الصاغة
            elif 'دولار الصاغة' in line:
                match = re.search(r'([\d\.]+)', line)
                if match: data['sagha_usd'] = match.group(1)
                
            elif 'سعر الدولار' in line and 'الأونصة' not in line and 'الصاغة' not in line:
                match = re.search(r'([\d\.]+)', line)
                if match: data['usd_rate'] = match.group(1)
        except Exception as e:
            print(f"Error parsing line: {line} -> {e}")
            continue

    return data

def generate_formatted_telegram_message(data):
    return f"""اسعار الذهب الان 💰

💍 عيار 18: {data['carat_18']} جنيه
💍 عيار 21: {data['carat_21']} جنيه
💍 عيار 24: {data['carat_24']} جنيه

💎 جنيه الذهب: {data['gold_pound']} جنيه
📊 الأونصة بالدولار: {data['ounce_usd']} دولار

🌟 سعر الشراء: {data['buy_price']}
🌟 سعر البيع: {data['sell_price']}

💵 سعر الدولار: {data['usd_rate']} جنيه
💵 دولار الصاغة: {data['sagha_usd']} جنيه"""

# --- التنفيذ الأساسي ---
def main():
    # استبدل النص التالي بالطريقة التي تجلب بها النص من التليجرام (مثلاً raw_text من القناة)
    raw_telegram_text = """ضع النص المستخرج هنا أو قم بربطه بمتغير الرسالة"""
    
    try:
        parsed_data = parse_gold_prices(raw_telegram_text)
        final_output = generate_formatted_telegram_message(parsed_data)
        
        print("تم استخراج البيانات بنجاح:")
        print(final_output)
        
        # كود حفظ البيانات أو إرسال القناة يوضع هنا
        
    except Exception as main_error:
        print(f"حدث خطأ أثناء التشغيل: {main_error}")

if __name__ == "__main__":
    main()
