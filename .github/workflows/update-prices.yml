name: Update gold prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Fetch and post gold prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import re
          import os
          import requests
          from bs4 import BeautifulSoup

          URL = "https://t.me/s/goldpricenowlive"

          headers = {'User-Agent': 'Mozilla/5.0'}
          response = requests.get(URL, headers=headers)
          soup = BeautifulSoup(response.text, 'html.parser')

          messages = soup.find_all('div', class_='tgme_widget_message_text')
          if not messages:
              raise SystemExit("لم يتم العثور على رسائل بالقناة")

          last_msg = ""
          for msg in reversed(messages):
              text = msg.get_text(separator="\n")
              if "عيار 21" in text or "اسعار الذهب" in text:
                  last_msg = text
                  break

          if not last_msg:
              raise SystemExit("لم يتم العثور على رسالة تحتوي على الأسعار")

          def extract_val(pattern, text):
              match = re.search(pattern, text)
              if match:
                  val = match.group(1).replace(",", "").strip()
                  try:
                      return float(val) if '.' in val else int(val)
                  except ValueError:
                      return val
              return "N/A"

          prices = {
              "price_gram_24k": extract_val(r"عيار\s*24\D*?(\d[\d,.]*)", last_msg),
              "price_gram_21k": extract_val(r"عيار\s*21\D*?(\d[\d,.]*)", last_msg),
              "price_gram_18k": extract_val(r"عيار\s*18\D*?(\d[\d,.]*)", last_msg),
              "gold_pound": extract_val(r"جنيه\s*الذهب\D*?(\d[\d,.]*)", last_msg),
              "ounce_usd": extract_val(r"الأونصة\s*بالدولار\D*?(\d[\d,.]*)", last_msg),
              "buy_price": extract_val(r"سعر\s*الشراء\D*?(\d[\d,.]*)", last_msg),
              "sell_price": extract_val(r"سعر\s*البيع\D*?(\d[\d,.]*)", last_msg),
              "usd_to_egp": extract_val(r"سعر\s*الدولار\D*?(\d[\d,.]*)", last_msg),
              "sagha_usd": extract_val(r"دولار\s*الصاغة\D*?(\d[\d,.]*)", last_msg)
          }

          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(prices, f, ensure_ascii=False, indent=2)

          print("24K:", prices["price_gram_24k"])
          print("21K:", prices["price_gram_21k"])
          print("18K:", prices["price_gram_18k"])

          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if bot_token and chat_id:
              message_text = (
                  f"🏆 <b>تحديث أسعار الذهب اليوم</b>\n\n"
                  f"🥇 عيار 24: <b>{prices['price_gram_24k']}</b> جنيه\n"
                  f"🥈 عيار 21: <b>{prices['price_gram_21k']}</b> جنيه\n"
                  f"🥉 عيار 18: <b>{prices['price_gram_18k']}</b> جنيه\n"
                  f"💰 جنيه الذهب: <b>{prices['gold_pound']}</b> جنيه\n"
              )
              
              telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              payload = {
                  "chat_id": chat_id,
                  "text": message_text,
                  "parse_mode": "HTML"
              }
              
              res = requests.post(telegram_url, data=payload)
              if res.status_code == 200:
                  print("تم إرسال الرسالة للقناة بنجاح!")
              else:
                  print(f"فشل الإرسال: {res.text}")
          PY

      - name: Check data
        run: |
          python - <<'PY'
          import json

          with open("prices.json", encoding="utf-8") as f:
              data = json.load(f)

          for key in ["price_gram_24k", "price_gram_21k", "price_gram_18k"]:
              if key not in data or data[key] == "N/A":
                  raise SystemExit(f"قيمة غير صالحة للمفتاح: {key}")

          print("البيانات المستخرجة صحيحة وتم التحقق منها")
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات في الأسعار"
          else
            git commit -m "Update gold prices from Telegram"
            git push
          fi
