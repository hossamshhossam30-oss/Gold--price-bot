name: Update gold prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get gold prices
        run: |
          curl -fsSL "https://api.goldprice.dev/v1/carat?currency=EGP" -o prices.json

      - name: Check data
        run: |
          python - <<'PY'
          import json

          with open("prices.json", encoding="utf-8") as f:
              data = json.load(f)

          for key in ["price_gram_24k", "price_gram_21k", "price_gram_18k"]:
              if key not in data:
                  raise SystemExit(f"Missing: {key}")

          print("Prices OK")
          print("24K:", data["price_gram_24k"])
          print("21K:", data["price_gram_21k"])
          print("18K:", data["price_gram_18k"])
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update gold prices"
          git push
