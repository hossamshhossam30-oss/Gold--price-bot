name: Update Gold Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-prices-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and update gold prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          SOURCE_CHANNEL = "https://t.me/s/goldpricenowlive?before=9999999"
          TARGET_CHANNEL = "@yomgdyd30"
          JSON_FILE = "prices.json"
          SOURCE_ATTEMPTS = 5
          TELEGRAM_ATTEMPTS = 3
          REQUEST_TIMEOUT = 30

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10; K) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Mobile Safari/537.36"
              ),
              "Cache-Control": "no-cache, no-store, max-age=0",
              "Pragma": "no-cache",
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
              "Connection": "close"
          }

          def normalize_digits(value):
              if value is None:
                  return None
              arabic = str.maketrans("٠١٢٣٤٥٦٧٨٩", "0123456789")
              persian = str.maketrans("۰۱۲۳۴۵۶۷۸۹", "0123456789")
              return str(value).translate(arabic).translate(persian)

          def clean_number(value):
              if value is None:
                  return None
              value = normalize_digits(value)
              value = (
                  value.replace(",", "")
                  .replace("٬", "")
                  .replace("٫", ".")
                  .replace(" ", "")
                  .strip()
              )
              value = re.sub(r"[^\d.]", "", value)
              if not value:
                  return None
              try:
                  number = float(value)
                  if number.is_integer():
                      return int(number)
                  return number
              except ValueError:
                  return None

          def normalize_text(text):
              if not text:
                  return ""
              text = normalize_digits(text)
              text = re.sub(r"[ \t]+", " ", text)
              text = re.sub(r"\n+", "\n", text)
              return text.strip()

          def extract_value(patterns, text):
              for pattern in patterns:
                  match = re.search(pattern, text, flags=re.IGNORECASE | re.UNICODE)
                  if match:
                      value = clean_number(match.group(1))
                      if value is not None:
                          return value
              return None

          def validate_prices(data):
              required = ["price_gram_24k", "price_gram_21k", "price_gram_18k"]
              for key in required:
                  value = data.get(key)
                  if value is None or isinstance(value, str) or value <= 0:
                      return False, f"Invalid value: {key}"

              p18, p21, p24 = data["price_gram_18k"], data["price_gram_21k"], data["price_gram_24k"]
              if not (p18 < p21 < p24):
                  return False, f"Invalid order: 18={p18}, 21={p21}, 24={p24}"
              return True, "OK"

          old_prices = {}
          if os.path.exists(JSON_FILE):
              try:
                  with open(JSON_FILE, "r", encoding="utf-8") as f:
                      old_prices = json.load(f)
              except Exception as e:
                  print("Warning reading old JSON:", e)

          html = None
          for attempt in range(1, SOURCE_ATTEMPTS + 1):
              cache_buster = f"&nocache={int(time.time())}-{os.getpid()}-{attempt}"
              source_url = f"{SOURCE_CHANNEL}{cache_buster}"
              print(f"Fetching source {attempt}/{SOURCE_ATTEMPTS}")
              try:
                  response = requests.get(source_url, headers=HEADERS, timeout=REQUEST_TIMEOUT)
                  response.raise_for_status()
                  if response.text:
                      html = response.text
                      break
              except Exception as e:
                  print("Source error:", e)
                  if attempt < SOURCE_ATTEMPTS:
                      time.sleep(attempt * 5)

          if not html:
              raise SystemExit("Could not fetch gold prices.")

          soup = BeautifulSoup(html, "html.parser")
          messages = soup.find_all("div", class_="tgme_widget_message_text")
          if not messages:
              raise SystemExit("No Telegram messages found.")

          latest_message = None
          for message in reversed(messages):
              text = normalize_text(message.get_text(separator="\n", strip=True))
              if re.search(r"\b24\b", text) and re.search(r"\b21\b", text) and re.search(r"\b18\b", text):
                  latest_message = text
                  break

          if not latest_message:
              raise SystemExit("No valid gold price message found.")

          price_24 = extract_value([r"عيار\s*24\s*[:：\-]?\s*([\d.]+)", r"24\s*عيار\s*[:：\-]?\s*([\d.]+)"], latest_message)
          price_21 = extract_value([r"عيار\s*21\s*[:：\-]?\s*([\d.]+)", r"21\s*عيار\s*[:：\-]?\s*([\d.]+)"], latest_message)
          price_18 = extract_value([r"عيار\s*18\s*[:：\-]?\s*([\d.]+)", r"18\s*عيار\s*[:：\-]?\s*([\d.]+)"], latest_message)
          gold_pound = extract_value([r"جنيه\s+الذهب\s*[:：\-]?\s*([\d.]+)", r"الجنيه\s+الذهب\s*[:：\-]?\s*([\d.]+)"], latest_message)
          ounce_usd = extract_value([r"الأوقية\s*(?:بالدولار)?\s*[:：\-]?\s*([\d.]+)", r"الأونصة\s*(?:بالدولار)?\s*[:：\-]?\s*([\d.]+)"], latest_message)
          buy_price = extract_value([r"سعر\s+الشراء\s*[:：\-]?\s*([\d.]+)", r"الشراء\s*[:：\-]?\s*([\d.]+)"], latest_message)
          sell_price = extract_value([r"سعر\s+البيع\s*[:：\-]?\s*([\d.]+)", r"البيع\s*[:：\-]?\s*([\d.]+)"], latest_message)
          usd_to_egp = extract_value([r"سعر\s+الدولار\s*[:：\-]?\s*([\d.]+)"], latest_message)
          sagha_usd = extract_value([r"دولار\s+الصاغة\s*[:：\-]?\s*([\d.]+)", r"الصاغة\s*[:：\-]?\s*([\d.]+)"], latest_message)

          extracted_data = {
              "price_gram_24k": price_24,
              "price_gram_21k": price_21,
              "price_gram_18k": price_18,
              "gold_pound": gold_pound,
              "ounce_usd": ounce_usd,
              "buy_price": buy_price,
              "sell_price": sell_price,
              "usd_to_egp": usd_to_egp,
              "sagha_usd": sagha_usd
          }

          valid, msg = validate_prices(extracted_data)
          if not valid:
              raise SystemExit("Price validation failed: " + msg)

          new_prices = {}
          prices_changed = False
          for key, new_val in extracted_data.items():
              old_val = old_prices.get(key)
              if new_val is not None:
                  new_prices[key] = new_val
                  if old_val != new_val:
                      prices_changed = True
              else:
                  new_prices[key] = old_val

          cairo_now = datetime.now(ZoneInfo("Africa/Cairo"))
          updated_at = cairo_now.strftime("%Y-%m-%d %H:%M:%S")
          new_prices["updated_at"] = updated_at
          new_prices["source"] = SOURCE_CHANNEL

          if prices_changed or not os.path.exists(JSON_FILE):
              with open(JSON_FILE, "w", encoding="utf-8") as f:
                  json.dump(new_prices, f, ensure_ascii=False, indent=2)
              print("prices.json updated.")
          else:
              print("No price change.")

          if prices_changed:
              bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
              if bot_token:
                  message_text = (
                      "💰 <b>أسعار الذهب الآن</b>\n\n"
                      f"💍 عيار 18: <b>{new_prices['price_gram_18k']}</b> جنيه\n"
                      f"💍 عيار 21: <b>{new_prices['price_gram_21k']}</b> جنيه\n"
                      f"💍 عيار 24: <b>{new_prices['price_gram_24k']}</b> جنيه\n\n"
                      f"💎 جنيه الذهب: <b>{new_prices.get('gold_pound', 'غير متوفر')}</b> جنيه\n"
                      f"📊 الأوقية بالدولار: <b>{new_prices.get('ounce_usd', 'غير متوفر')}</b> دولار\n\n"
                      f"🌟 سعر الشراء: <b>{new_prices.get('buy_price', 'غير متوفر')}</b>\n"
                      f"🌟 سعر البيع: <b>{new_prices.get('sell_price', 'غير متوفر')}</b>\n\n"
                      f"💵 سعر الدولار: <b>{new_prices.get('usd_to_egp', 'غير متوفر')}</b> جنيه\n"
                      f"💵 دولار الصاغة: <b>{new_prices.get('sagha_usd', 'غير متوفر')}</b> جنيه\n\n"
                      f"🕐 آخر تحديث: <b>{updated_at}</b>"
                  )
                  telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                  payload = {"chat_id": TARGET_CHANNEL, "text": message_text, "parse_mode": "HTML", "disable_web_page_preview": True}
                  for attempt in range(1, TELEGRAM_ATTEMPTS + 1):
                      try:
                          res = requests.post(telegram_url, data=payload, timeout=20)
                          if res.status_code == 200 and res.json().get("ok"):
                              print("Successfully published to Telegram")
                              break
                      except Exception as e:
                          print("Telegram error:", e)
                      time.sleep(5)

          PY

      - name: Validate prices.json
        run: |
          python - <<'PY'
          import json, os, sys
          if not os.path.exists("prices.json"):
              sys.exit(1)
          with open("prices.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          p18, p21, p24 = data.get("price_gram_18k"), data.get("price_gram_21k"), data.get("price_gram_24k")
          if not (p18 and p21 and p24 and p18 < p21 < p24):
              sys.exit(1)
          print("prices.json validation OK.")
          PY

      - name: Commit and Push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update gold prices"
            git pull --rebase origin HEAD
            git push origin HEAD
            echo "prices.json pushed successfully."
          fi
